function heading(t,s){return '<h1>'+safe(t)+'</h1><p class="sub">'+safe(s)+'</p>'}
function searchbar(id,value){return '<div class="search">'+icon('search')+'<input id="'+id+'" type="search" autocomplete="off" aria-label="Tìm kiếm" value="'+safe(value||"")+'" placeholder="Tìm kiếm kiến thức, phương pháp, tài nguyên..."></div>'}
function tile(t,d,ic,p){return '<button class="card" data-page="'+p+'"><span class="badge-icon">'+icon(ic)+'</span><strong>'+t+'</strong><p>'+d+'</p></button>'}
function resourceCard(r){return '<button class="card" data-resource="'+r[0]+'"><span class="badge-icon">'+icon(r[4])+'</span><span class="source">'+safe(r[2])+' · '+safe(r[3])+'</span><strong>'+safe(r[1])+'</strong><p>'+safe(r[6])+'</p><span class="link-label">Xem tài nguyên '+icon('arrow')+'</span></button>'}
function related(ids){var a=resources.filter(function(r){return ids.indexOf(r[0])>=0});return '<div class="section"><h2>Tài nguyên liên quan</h2><span class="muted">'+a.length+' tài nguyên</span></div>'+(a.length?'<div class="grid">'+a.map(resourceCard).join('')+'</div>':'<div class="note">Chưa có tài nguyên liên quan được gắn.</div>')}
function uxItem(n){return {id:'UXM-'+String(n).padStart(3,'0'),title:UXNames[n-1],cat:UXGroups[n-1],desc:UXDesc[n-1],res:resources.filter(function(r){return r[7].indexOf(n)>=0}).map(function(r){return r[0]})}}
function uiItem(n){var references=n>=6&&n<=8?["R9"]:n===1||n===2||n===3?["R8"]:n===9||n===13?["R5"]:["R8"];return{id:'UIK-'+String(n).padStart(3,'0'),title:UINames[n-1],cat:UIGroups[n-1],desc:UIDesc[n-1],res:references}}
function getItem(id){var n=Number(id.slice(4));return id.startsWith("UXM")?uxItem(n):uiItem(n)}
function home(){return '<section class="hero"><div class="hero-layout"><div class="hero-copy"><div class="eyebrow">HỌC · KHÁM PHÁ · ỨNG DỤNG</div><h1>Hiểu đúng phương pháp.<br>Thiết kế có cơ sở.</h1><p class="sub">Tra cứu kiến thức UX/UI, khám phá tài nguyên chuyên môn và tự đưa ra quyết định thiết kế.</p>'+searchbar('home-search','')+'</div><div class="hero-visual" aria-hidden="true"><div class="hero-visual-head"><span class="visual-dot"></span><span class="visual-dot"></span><span class="visual-dot"></span><span class="visual-caption">DESIGN THINKING</span></div><div class="visual-step"><span class="visual-step-icon">01</span><span><b>Khám phá vấn đề</b><small>Understand the problem</small></span></div><div class="visual-connector"></div><div class="visual-step"><span class="visual-step-icon">02</span><span><b>Chọn phương pháp</b><small>Choose the right method</small></span></div><div class="visual-connector"></div><div class="visual-step"><span class="visual-step-icon">03</span><span><b>Tự đưa ra giải pháp</b><small>Think independently</small></span></div></div></div></section><div class="section"><h2>Khám phá Playbook</h2><span class="muted">4 nhóm chức năng</span></div><div class="grid">'+tile('Thư viện UX','Research, Analysis, Usability và Metrics.','brain','ux')+tile('Thư viện UI','Principles, Patterns và Design System.','palette','ui')+tile('Định hướng dự án','Tìm phương pháp phù hợp với đề bài.','route','navigator')+tile('Đánh giá thiết kế','Tự đánh giá và kiểm chứng giải pháp.','checklist','review')+'</div><div class="section"><h2>Tài nguyên nổi bật</h2><button class="chip" data-page="resources">Xem tất cả '+icon('arrow')+'</button></div><div class="grid3">'+['R2','R5','R8'].map(function(id){return resourceCard(resources.find(function(r){return r[0]===id}))}).join('')+'</div>'}
function filters(cats){return '<div class="filters">'+cats.map(function(c){return '<button class="chip '+(state.filter===c?'active':'')+'" data-filter="'+safe(c)+'">'+safe(c)+'</button>'}).join('')+'</div>'}
function catalog(k){var arr=Array.from({length:k==='ux'?27:27},function(_,i){return k==='ux'?uxItem(i+1):uiItem(i+1)}),cats=['Tất cả'].concat(Array.from(new Set(arr.map(function(x){return x.cat})))),list=arr.filter(function(x){return(state.filter==='Tất cả'||x.cat===state.filter)&&(x.title+' '+x.desc+' '+x.id).toLowerCase().includes(state.search.toLowerCase())});return heading(k==='ux'?'Thư viện UX':'Thư viện UI',k==='ux'?'Khám phá 27 phương pháp UX theo mục tiêu và giai đoạn.':'Tra cứu 27 nguyên tắc, UI Patterns và Foundations.')+searchbar('catalog-search',state.search)+filters(cats)+'<div class="section"><h2>Danh sách kiến thức</h2><span class="muted">'+list.length+' kết quả</span></div>'+(list.map(function(x){return '<button class="item" data-item="'+x.id+'"><strong>'+safe(x.title)+'</strong><div>'+tag(x.id)+tag(x.cat,true)+tag(x.res.length+' tài nguyên')+'</div><p>'+safe(x.desc)+'</p></button>'}).join('')||'<div class="empty">Không tìm thấy kiến thức phù hợp.</div>')}
function knowledge(x){return '<button class="back" data-back="1">'+icon('back')+' Quay lại</button>'+heading(x.title,x.desc)+tag(x.id)+tag(x.cat,true)+'<div class="block"><strong>Mục đích</strong><p>'+safe(x.desc)+'</p></div><div class="block"><strong>Khi nào nên sử dụng?</strong><p>Áp dụng khi mục tiêu hoặc vấn đề của dự án liên quan trực tiếp đến '+safe(x.title)+'. Cần kiểm tra dữ liệu, bối cảnh và điều kiện triển khai.</p></div><div class="block"><strong>Giới hạn cần lưu ý</strong><p>Không dùng một phương pháp đơn lẻ để chứng minh mọi giả định. Luôn phân biệt bằng chứng thực tế với diễn giải của nhóm.</p></div><div class="block"><strong>Kết quả cần đạt</strong><p>Findings, lý do lựa chọn phương pháp và những điểm cần kiểm chứng tiếp theo.</p></div><div class="note"><strong>Câu hỏi định hướng</strong><p>Bằng chứng nào cho thấy phương pháp hoặc nguyên tắc này phù hợp? Điều gì có thể khiến kết luận sai?</p></div>'+related(x.res)+'<p class="muted" style="margin-top:16px">Đây là nội dung tóm tắt V1.5. Bài học đầy đủ đang được biên soạn.</p>'}
function resourcePage(){var cats=['Tất cả'].concat(Array.from(new Set(resources.map(function(r){return r[3]})))),list=resources.filter(function(r){return(state.filter==='Tất cả'||state.filter===r[3])&&(r[1]+' '+r[2]+' '+r[6]).toLowerCase().includes(state.search.toLowerCase())});return heading('Thư viện tài nguyên','Template, Checklist và nguồn tham khảo chuyên môn.')+searchbar('resource-search',state.search)+filters(cats)+'<div class="section"><h2>Khám phá tài nguyên</h2><span class="muted">'+list.length+' kết quả</span></div><div class="grid3">'+list.map(resourceCard).join('')+'</div>'}
function resourceDetail(r){return '<button class="back" data-back="1">'+icon('back')+' Quay lại</button><span class="badge-icon" style="display:grid;place-items:center;width:48px;height:48px;background:#eaf5ed;border-radius:10px;color:#168365;margin-bottom:14px">'+icon(r[4])+'</span>'+heading(r[1],r[6])+tag(r[2],true)+tag(r[3])+'<div class="block"><strong>Mục đích</strong><p>'+safe(r[6])+'</p></div><div class="block"><strong>Cách sử dụng</strong><p>Tham khảo tài liệu gốc, chọn phần phù hợp với nghiên cứu, điều chỉnh theo đề bài và tự kiểm chứng kết luận.</p></div><div class="note"><strong>Điều cần lưu ý</strong><p>Học viên cần phân biệt ví dụ minh họa với evidence của chính dự án mình.</p></div><a class="btn" href="'+safe(r[5])+'" target="_blank" rel="noopener noreferrer">Mở tài liệu gốc '+icon('external')+'</a><p class="muted" style="margin-top:11px">Nguồn: '+safe(r[2])+'</p>'}
function navigator(){var p=state.project;return heading('Định hướng dự án','Nhập bối cảnh để tham khảo các phương pháp và tài nguyên liên quan.')+'<div class="grid"><div><label class="label">Loại dự án</label><select class="field" data-proj="type">'+['Redesign','New Product','Feature Improvement','UX Audit'].map(function(x){return '<option '+(p.type===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div><label class="label">Thời gian</label><select class="field" data-proj="time">'+[['2','1–2 tuần'],['4','3–4 tuần'],['8','5–8 tuần'],['12','Trên 8 tuần']].map(function(x){return '<option value="'+x[0]+'" '+(p.time===x[0]?'selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div></div><label class="label">Vấn đề đang cần nghiên cứu</label><select class="field" data-proj="problem">'+problems.map(function(x,i){return '<option value="'+i+'" '+(p.problem===i?'selected':'')+'>'+safe(x[0])+'</option>'}).join('')+'</select><label class="label">Dữ liệu hiện có</label><select class="field" data-proj="evidence">'+[['none','Chưa có dữ liệu'],['research','Research Findings'],['analytics','Product Analytics'],['both','Cả hai']].map(function(x){return '<option value="'+x[0]+'" '+(p.evidence===x[0]?'selected':'')+'>'+x[1]+'</option>'}).join('')+'</select><label class="label">Mô tả đề bài (tùy chọn)</label><textarea class="field" data-proj="brief" placeholder="Mô tả thêm mục tiêu hoặc ràng buộc...">'+safe(p.brief)+'</textarea><div class="note"><strong>Nguyên tắc</strong><p>Gợi ý dựa trên Problem-to-Method Matrix, không tự kết luận nguyên nhân hoặc sinh thiết kế. Mô tả tự do chưa được phân tích tự động ở V1.5.</p></div><button class="btn" data-action="recommend">Xem phương pháp đề xuất '+icon('arrow')+'</button>'}
function recommendations(){var p=problems[state.project.problem],xs=p[1].map(uxItem),ys=p[2].map(uiItem),rs=Array.from(new Set(xs.concat(ys).flatMap(function(k){return k.res})));return '<button class="back" data-page="navigator">'+icon('back')+' Điều chỉnh đề bài</button>'+heading('Phương pháp đề xuất',p[0])+'<div class="note">Bối cảnh: '+safe(state.project.type)+' · '+safe(state.project.time)+' tuần · '+(state.project.evidence==='none'?'Chưa có research':'Có một phần dữ liệu')+'.<p>Các đề xuất là hướng nghiên cứu, chưa xác nhận nguyên nhân của vấn đề.</p></div><div class="section"><h2>UX Methods</h2></div>'+xs.map(function(k,i){return '<div class="item"><strong>'+safe(k.title)+'</strong><div>'+tag(i===0?'Ưu tiên':'Hỗ trợ',i===0)+'</div><p>'+safe(k.desc)+'</p><button class="chip" data-item="'+k.id+'">Tìm hiểu phương pháp '+icon('arrow')+'</button></div>'}).join('')+'<div class="section"><h2>Kiến thức UI liên quan</h2></div>'+(ys.length?ys.map(function(k){return '<button class="item" data-item="'+k.id+'"><strong>'+safe(k.title)+'</strong><p>'+safe(k.desc)+'</p></button>'}).join(''):'<div class="note">Ưu tiên nghiên cứu vấn đề trước khi chọn UI Pattern.</div>')+related(rs)}
function reviewPage(){return heading('Đánh giá thiết kế','Tự đánh giá theo nguyên tắc UX/UI, tìm tài liệu để tiếp tục kiểm chứng.')+'<div class="note">Self-assessment. Playbook không tự chấm điểm hay đưa ra một giải pháp thiết kế bắt buộc.</div>'+reviews.map(function(r,i){return '<div class="review-row"><strong>'+(i+1)+'. '+r[0]+'</strong><p>'+r[1]+'</p><div class="review-options">'+['Đạt','Cần cải thiện','Cần kiểm chứng','Không áp dụng'].map(function(v){return '<button class="'+(state.reviews[i]===v?'selected':'')+'" data-review="'+i+'" data-value="'+v+'">'+v+'</button>'}).join('')+'</div></div>'}).join('')+'<button class="btn" data-action="summary">Xem kết quả đánh giá '+icon('arrow')+'</button>'}
function summary(){var bad=reviews.filter(function(r,i){return ['Cần cải thiện','Cần kiểm chứng'].includes(state.reviews[i])});return '<button class="back" data-page="review">'+icon('back')+' Sửa đánh giá</button>'+heading('Kết quả tự đánh giá','Những vấn đề cần cải thiện và kiểm chứng.')+(bad.map(function(r){return '<button class="item" data-item="'+r[2]+'"><strong>'+r[0]+'</strong><p>'+r[1]+'</p><p>Tìm hiểu kiến thức liên quan →</p></button>'}).join('')||'<div class="note">Chưa có tiêu chí được đánh dấu cần cải thiện hoặc kiểm chứng.</div>')+related(Array.from(new Set(bad.flatMap(function(r){return getItem(r[2]).res}))))}
function results(){var term=state.search.toLowerCase(),items=Array.from({length:27},function(_,i){return uxItem(i+1)}).concat(Array.from({length:27},function(_,i){return uiItem(i+1)})).filter(function(x){return (x.title+' '+x.desc+' '+x.id).toLowerCase().includes(term)}),rs=resources.filter(function(r){return (r[1]+' '+r[6]).toLowerCase().includes(term)});return heading('Kết quả tìm kiếm','Tra cứu trong toàn bộ thư viện.')+searchbar('global-search',state.search)+'<div class="section"><h2>Kiến thức</h2><span class="muted">'+items.length+'</span></div>'+items.map(function(x){return '<button class="item" data-item="'+x.id+'"><strong>'+safe(x.title)+'</strong><p>'+safe(x.desc)+'</p></button>'}).join('')+'<div class="section"><h2>Tài nguyên</h2><span class="muted">'+rs.length+'</span></div><div class="grid3">'+rs.map(resourceCard).join('')+'</div>'}
function navigate(p){state.page=p;state.selected=null;state.filter='Tất cả';state.search='';render()}
function render(){var nav=[['home','house','Tổng quan'],['ux','brain','Thư viện UX'],['ui','palette','Thư viện UI'],['navigator','route','Định hướng dự án'],['review','checklist','Đánh giá thiết kế'],['resources','library','Tài nguyên']];document.getElementById('navigation').innerHTML='<div class="aside-title">DANH MỤC</div>'+nav.map(function(a){return '<button class="nav '+(state.page===a[0]?'active':'')+'" data-page="'+a[0]+'">'+icon(a[1])+safe(a[2])+'</button>'}).join('')+'<div class="side-note">Guide the Thinking,<br>Not the Design.</div>';var s=state.selected;area.innerHTML=s?(s.type==='item'?knowledge(getItem(s.id)):resourceDetail(resources.find(function(r){return r[0]===s.id}))):state.page==='home'?home():state.page==='ux'||state.page==='ui'?catalog(state.page):state.page==='navigator'?navigator():state.page==='recommend'?recommendations():state.page==='review'?reviewPage():state.page==='summary'?summary():state.page==='search'?results():resourcePage()}
document.addEventListener('click',function(e){var x=e.target.closest('[data-page]');if(x){navigate(x.dataset.page);return}x=e.target.closest('[data-item]');if(x){state.previous=state.page;state.selected={type:'item',id:x.dataset.item};render();return}x=e.target.closest('[data-resource]');if(x){state.previous=state.page;state.selected={type:'resource',id:x.dataset.resource};render();return}x=e.target.closest('[data-back]');if(x){state.selected=null;state.page=state.previous;render();return}x=e.target.closest('[data-filter]');if(x){state.filter=x.dataset.filter;render();return}x=e.target.closest('[data-review]');if(x){state.reviews[x.dataset.review]=x.dataset.value;render();return}x=e.target.closest('[data-action]');if(x){state.page=x.dataset.action;render()}});
document.addEventListener('input',function(e){if(e.target.dataset.proj){state.project[e.target.dataset.proj]=e.target.value;return}if(['home-search','catalog-search','resource-search','global-search'].includes(e.target.id)){state.search=e.target.value;var id=e.target.id==='home-search'?'global-search':e.target.id,pos=e.target.selectionStart;if(e.target.id==='home-search')state.page='search';render();var newInput=document.getElementById(id);if(newInput){newInput.focus();newInput.setSelectionRange(pos,pos)}}});
document.addEventListener('change',function(e){if(e.target.dataset.proj){state.project[e.target.dataset.proj]=e.target.dataset.proj==='problem'?Number(e.target.value):e.target.value}});
render();
})();
</script></body></html>
